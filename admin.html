<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồi Âm Admin Pro Max</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #030712;
            --bg-card: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary-gradient: linear-gradient(135deg, #8b5cf6 0%, #d946ef 100%);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --sidebar-w: 260px;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-dark);
            color: var(--text-main); 
            margin: 0; height: 100vh; display: flex; overflow: hidden; font-size: 14px;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(217, 70, 239, 0.15) 0%, transparent 40%);
        }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; } 
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }

        /* GLASS EFFECT */
        .glass-panel {
            background: var(--bg-card);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* SIDEBAR */
        .sidebar { 
            width: var(--sidebar-w); display: flex; flex-direction: column; padding: 24px; gap: 8px; flex-shrink: 0; z-index: 100;
            border-right: 1px solid var(--glass-border); background: rgba(15, 23, 42, 0.8); transition: transform 0.3s ease;
        }
        .brand { 
            font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 30px; 
            display: flex; align-items: center; gap: 12px;
            background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .nav-link { 
            padding: 12px 16px; border-radius: 12px; color: var(--text-sub); cursor: pointer; 
            font-weight: 600; display: flex; align-items: center; gap: 12px; transition: 0.2s;
        }
        .nav-link:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .nav-link.active { 
            background: rgba(139, 92, 246, 0.15); color: #fff; border: 1px solid rgba(139, 92, 246, 0.2);
        }

        /* MAIN */
        .main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
        .header { height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; }
        .page-title { font-size: 20px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 15px; }
        
        /* Mobile Menu Toggle */
        .menu-toggle { display: none; font-size: 24px; cursor: pointer; }

        .view-section { flex: 1; overflow-y: auto; padding: 0 30px 40px 30px; display: none; }
        .view-section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* DASHBOARD STATS */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { padding: 20px; border-radius: 16px; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; }
        .stat-card::after { content: ''; position: absolute; top: -50px; right: -50px; width: 100px; height: 100px; background: rgba(255,255,255,0.05); border-radius: 50%; }
        .stat-val { font-size: 32px; font-weight: 800; color: #fff; }
        .stat-label { font-size: 13px; color: var(--text-sub); text-transform: uppercase; font-weight: 700; }
        .stat-icon { position: absolute; right: 20px; top: 20px; font-size: 24px; opacity: 0.2; }

        /* FORM */
        .form-layout { display: flex; gap: 30px; max-width: 1100px; margin: 0 auto; }
        .form-left { flex: 1; }
        .form-right { width: 320px; flex-shrink: 0; }

        .form-card { border-radius: 20px; padding: 30px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-row { display: flex; gap: 20px; margin-bottom: 20px; }
        .col { flex: 1; }
        
        label { display: block; margin-bottom: 8px; font-size: 12px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { 
            width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--glass-border); 
            color: #fff; padding: 12px 16px; border-radius: 10px; font-size: 14px; transition: 0.2s;
        }
        input:focus, select:focus { border-color: #a855f7; box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.1); }

        /* IMAGE PREVIEW */
        .preview-box {
            width: 100%; aspect-ratio: 16/9; background: rgba(0,0,0,0.3); border-radius: 16px;
            border: 2px dashed var(--glass-border); display: flex; align-items: center; justify-content: center;
            overflow: hidden; margin-bottom: 20px; position: relative;
        }
        .preview-box img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .preview-box.has-img img { display: block; }
        .preview-box.has-img .placeholder { display: none; }
        .placeholder { color: var(--text-sub); display: flex; flex-direction: column; align-items: center; gap: 10px; }

        /* BUTTONS */
        .btn { border: none; padding: 12px 24px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
        .btn-primary { background: var(--primary-gradient); color: #fff; width: 100%; justify-content: center; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(168, 85, 247, 0.4); }
        .btn-icon { width: 32px; height: 32px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; background: rgba(255,255,255,0.05); color: #cbd5e1; transition: 0.2s; }
        .btn-icon:hover { background: #fff; color: #000; }
        .btn-parse { position: absolute; right: 6px; top: 5px; bottom: 5px; background: rgba(168, 85, 247, 0.2); color: #d8b4fe; border: 1px solid rgba(168, 85, 247, 0.3); padding: 0 12px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; }
        .btn-parse:hover { background: #a855f7; color: #fff; }

        /* TABLE */
        .table-container { border-radius: 16px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: rgba(15, 23, 42, 0.4); padding: 16px; text-align: left; font-size: 12px; color: #94a3b8; font-weight: 700; text-transform: uppercase; }
        td { padding: 16px; border-bottom: 1px solid var(--glass-border); color: #f1f5f9; vertical-align: middle; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        
        .thumb-cell img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; background: #333; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
        .badge.finished { background: rgba(16, 185, 129, 0.1); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); }
        .badge.ongoing { background: rgba(245, 158, 11, 0.1); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.2); }

        /* MODAL (New Feature) */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 200; display: none; align-items: center; justify-content: center; opacity: 0; transition: 0.3s; }
        .modal.open { display: flex; opacity: 1; }
        .modal-content { width: 500px; max-width: 90%; background: #1e293b; border: 1px solid var(--glass-border); padding: 30px; border-radius: 20px; transform: scale(0.9); transition: 0.3s; }
        .modal.open .modal-content { transform: scale(1); }

        /* TOAST */
        #toast { position: fixed; bottom: 30px; right: 30px; background: #0f172a; border: 1px solid var(--glass-border); padding: 16px 24px; border-radius: 12px; color: #fff; font-weight: 600; transform: translateY(100px); opacity: 0; transition: 0.3s; z-index: 3000; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #toast.show { transform: translateY(0); opacity: 1; }

        @media (max-width: 900px) { 
            .form-layout { flex-direction: column; } .form-right { width: 100%; } 
            .sidebar { position: fixed; left: -260px; height: 100%; bottom: 0; }
            .sidebar.active { left: 0; box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
            .header { padding: 0 20px; } 
            .menu-toggle { display: block; }
            .page-title { font-size: 18px; }
        }
    </style>
</head>
<body>

    <div id="login-screen" style="position: fixed; inset: 0; z-index: 999; display: flex; align-items: center; justify-content: center; background: #030712;">
        <div class="glass-panel" style="padding: 40px; border-radius: 24px; width: 380px; text-align: center;">
            <div style="font-size: 40px; margin-bottom: 10px;">💿</div>
            <h2 style="margin: 0 0 20px 0; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">ADMIN ACCESS</h2>
            <input type="password" id="pass" placeholder="Mật khẩu..." style="margin-bottom: 20px; text-align: center;">
            <button class="btn btn-primary" onclick="login()">Truy cập</button>
        </div>
    </div>

    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0; color:#fff">Sửa Thông Tin</h3>
            <input type="hidden" id="edit-id">
            <div class="form-group">
                <label>Tên Truyện</label>
                <input type="text" id="edit-name">
            </div>
            <div class="form-row">
                <div class="col"><label>Tác Giả</label><input type="text" id="edit-author"></div>
                <div class="col"><label>Số Tập</label><input type="text" id="edit-count"></div>
            </div>
            <div class="form-row">
                <div class="col"><label>Thể Loại</label><select id="edit-cat"><option value="Chủ Thụ">Chủ Thụ</option><option value="Chủ Công">Chủ Công</option><option value="Hỗ Công">Hỗ Công</option><option value="Vô CP">Vô CP</option><option value="Hệ Thống">Hệ Thống</option><option value="Khác">Khác</option></select></div>
                <div class="col"><label>Trạng Thái</label><select id="edit-status"><option value="Hoàn">Hoàn</option><option value="Đang ra">Đang ra</option></select></div>
            </div>
            <div class="form-group">
                <label>Link Ảnh</label>
                <input type="text" id="edit-img">
            </div>
            <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:20px">
                <button class="btn" style="background:#334155; color:#fff" onclick="closeEdit()">Hủy</button>
                <button class="btn btn-primary" style="width:auto" onclick="saveEdit()">Lưu Thay Đổi</button>
            </div>
        </div>
    </div>

    <div id="admin-ui" style="display:none; width:100%; height:100%;">
        <div class="sidebar glass-panel" id="sidebar">
            <div class="brand">
                <i class="fa-solid fa-compact-disc"></i> HỒI ÂM CMS
                <i class="fa-solid fa-xmark menu-toggle" style="margin-left:auto; font-size:18px" onclick="toggleMenu()"></i>
            </div>
            <div class="nav-link active" onclick="switchTab('dashboard', this); loadStats()"><i class="fa-solid fa-chart-pie"></i> Tổng Quan</div>
            <div class="nav-link" onclick="switchTab('list', this); fetchData()"><i class="fa-solid fa-list"></i> Kho Truyện</div>
            <div class="nav-link" onclick="switchTab('add', this)"><i class="fa-solid fa-plus"></i> Thêm Mới</div>
            <div style="flex:1"></div>
            <div class="nav-link" onclick="location.reload()" style="color:#ef4444"><i class="fa-solid fa-right-from-bracket"></i> Đăng Xuất</div>
        </div>

        <div class="main-content">
            <div class="header">
                <div class="page-title">
                    <i class="fa-solid fa-bars menu-toggle" onclick="toggleMenu()"></i>
                    <span id="page-title">Tổng Quan</span>
                </div>
                <div style="font-size: 12px; color: var(--text-sub);">Database: <span style="color:#10b981">● Online</span></div>
            </div>

            <div id="view-dashboard" class="view-section active">
                <div class="stats-grid">
                    <div class="glass-panel stat-card">
                        <div class="stat-label">Tổng số truyện</div>
                        <div class="stat-val" id="stat-total">0</div>
                        <i class="fa-solid fa-book stat-icon"></i>
                    </div>
                    <div class="glass-panel stat-card">
                        <div class="stat-label">Tổng số tập</div>
                        <div class="stat-val" id="stat-episodes">0</div>
                        <i class="fa-solid fa-layer-group stat-icon"></i>
                    </div>
                    <div class="glass-panel stat-card">
                        <div class="stat-label">Thể loại hot</div>
                        <div class="stat-val" id="stat-cat" style="font-size:24px">...</div>
                        <i class="fa-solid fa-fire stat-icon"></i>
                    </div>
                </div>
                <div class="glass-panel" style="padding:20px; border-radius:16px">
                    <h3 style="margin-top:0; color:var(--text-sub)">Truyện mới cập nhật</h3>
                    <div id="recent-list"></div>
                </div>
            </div>

            <div id="view-add" class="view-section">
                <div class="form-layout">
                    <div class="form-left glass-panel form-card">
                        <div class="form-group">
                            <label><i class="fa-brands fa-youtube" style="color:#ef4444"></i> Link Youtube Playlist</label>
                            <div style="position: relative;">
                                <input type="text" id="inp-url" placeholder="Paste link vào đây..." oninput="debounceFetch()">
                                <button class="btn-parse" onclick="autoFetch()"><i class="fa-solid fa-bolt"></i> GET INFO</button>
                            </div>
                        </div>
                        <div style="margin: 20px 0; border-top: 1px dashed var(--glass-border);"></div>
                        <div class="form-group">
                            <label>Tên Gốc (Youtube)</label>
                            <input type="text" id="inp-raw-title" readonly style="opacity: 0.7; font-style: italic;">
                        </div>
                        <div class="form-row">
                            <div class="col" style="flex: 2"><label>Tên Truyện</label><input type="text" id="inp-name"></div>
                            <div class="col"><label>Tác Giả</label><input type="text" id="inp-author"></div>
                        </div>
                        <div class="form-row">
                            <div class="col"><label>Số Tập</label><input type="text" id="inp-count"></div>
                            <div class="col"><label>Trạng Thái</label><select id="inp-status"><option value="Hoàn">Hoàn thành</option><option value="Đang ra">Đang cập nhật</option></select></div>
                            <div class="col"><label>Thể Loại</label><select id="inp-cat"><option value="Chủ Thụ">Chủ Thụ</option><option value="Chủ Công">Chủ Công</option><option value="Hỗ Công">Hỗ Công</option><option value="Vô CP">Vô CP</option><option value="Hệ Thống">Hệ Thống</option><option value="Khác">Khác</option></select></div>
                        </div>
                    </div>
                    <div class="form-right glass-panel form-card">
                        <label>Ảnh Bìa</label>
                        <div class="preview-box" id="img-preview-box">
                            <div class="placeholder"><i class="fa-regular fa-image" style="font-size: 30px;"></i><span>Trống</span></div>
                            <img id="img-preview" src="" alt="">
                        </div>
                        <div class="form-group"><label>Link Ảnh</label><input type="text" id="inp-img" style="font-size: 11px;"></div>
                        <div class="form-group"><label>Playlist ID</label><input type="text" id="inp-pid" readonly style="font-family: monospace; text-align: center; background: rgba(0,0,0,0.3);"></div>
                        <button class="btn btn-primary" onclick="addStory()">LƯU TRUYỆN <i class="fa-solid fa-arrow-right"></i></button>
                    </div>
                </div>
            </div>

            <div id="view-list" class="view-section">
                <div style="display: flex; gap: 15px; margin-bottom: 20px;">
                    <div style="position: relative; flex: 1;">
                        <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 16px; top: 13px; color: var(--text-sub);"></i>
                        <input type="text" id="search-list" placeholder="Tìm kiếm..." style="padding-left: 45px;" onkeyup="filterList()">
                    </div>
                    <button class="btn" style="background: rgba(255,255,255,0.1); color: #fff; width: auto;" onclick="fetchData()"><i class="fa-solid fa-rotate"></i></button>
                </div>
                <div class="glass-panel table-container">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 60px;">Ảnh</th>
                                <th>Tên Truyện</th>
                                <th>Tác Giả</th>
                                <th>Trạng Thái</th>
                                <th>Số Tập</th>
                                <th style="text-align: right;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        const DB_URL = 'https://lpeijpxqelyljkdjyfil.supabase.co';
        const DB_KEY = 'sb_publishable_n95DoJPIr7_KgktuE5ilZg_7a0ICkcT';
        const db = supabase.createClient(DB_URL, DB_KEY);

        let allData = [];
        let fetchTimeout;

        // AUTH & UI
        function login() {
            if(document.getElementById('pass').value === 'hoiam20102003') {
                document.getElementById('login-screen').style.display='none';
                document.getElementById('admin-ui').style.display='flex';
                loadStats(); // Auto load stats
            } else showToast('Sai mật khẩu!', 'error');
        }

        function switchTab(tab, el) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.getElementById('view-'+tab).classList.add('active');
            document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            
            const titles = { 'dashboard': 'Tổng Quan', 'add': 'Thêm Truyện', 'list': 'Kho Truyện' };
            document.getElementById('page-title').innerText = titles[tab];
            
            if(window.innerWidth < 900) document.getElementById('sidebar').classList.remove('active');
        }

        function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }

        // --- DASHBOARD LOGIC ---
        async function loadStats() {
            const { data } = await db.from('playlists').select('*');
            allData = data || [];
            
            document.getElementById('stat-total').innerText = allData.length;
            
            // Tính tổng số tập
            let eps = 0;
            const cats = {};
            allData.forEach(i => {
                const num = parseInt(i.count) || 0;
                eps += num;
                cats[i.category] = (cats[i.category] || 0) + 1;
            });
            document.getElementById('stat-episodes').innerText = eps.toLocaleString();
            
            // Tìm thể loại hot nhất
            let maxCat = '-', maxVal = 0;
            for(const [k, v] of Object.entries(cats)) {
                if(v > maxVal) { maxVal = v; maxCat = k; }
            }
            document.getElementById('stat-cat').innerText = maxCat;

            // Render 5 truyện mới nhất
            const recent = [...allData].sort((a,b) => b.id - a.id).slice(0, 5);
            const rDiv = document.getElementById('recent-list');
            rDiv.innerHTML = recent.map(i => `
                <div style="display:flex; gap:10px; align-items:center; padding:10px; border-bottom:1px solid var(--glass-border)">
                    <img src="${i.image_url||'#'}" style="width:40px; height:40px; border-radius:6px; object-fit:cover; background:#333">
                    <div><div style="font-weight:700">${i.name}</div><div style="font-size:11px; color:#888">${i.created_at.substr(0,10)}</div></div>
                </div>
            `).join('');
        }

        // --- AUTO FETCH & FORM LOGIC ---
        function debounceFetch() { clearTimeout(fetchTimeout); fetchTimeout = setTimeout(autoFetch, 600); }

        async function autoFetch() {
            const url = document.getElementById('inp-url').value;
            if(!url.includes('list=')) return;
            let pid = "";
            try { pid = new URL(url).searchParams.get("list"); } catch { pid = url.split('list=')[1]?.split('&')[0]; }
            
            if(pid) {
                document.getElementById('inp-pid').value = pid;
                const btn = document.querySelector('.btn-parse');
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Loading...';
                await deepScrapeYoutube(pid, btn);
            }
        }

        async function deepScrapeYoutube(pid, btn) {
            try {
                const res = await fetch('https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent('https://www.youtube.com/playlist?list=' + pid));
                const html = await res.text();

                let titleMatch = html.match(/<meta property="og:title" content="(.*?)">/);
                let title = titleMatch ? titleMatch[1].replace(' - YouTube', '') : "";

                let count = "? tập";
                const matchCount = html.match(/"numVideosText":\{"runs":\[\{"text":"(\d+)"/);
                if (matchCount) count = matchCount[1] + " tập";

                let img = "";
                const imgMatch = html.match(/<meta property="og:image" content="(.*?)">/);
                if(imgMatch) img = imgMatch[1].replace('mqdefault.jpg', 'maxresdefault.jpg');

                if (title) {
                    fillForm({ title, count, img });
                    btn.innerHTML = '<i class="fa-solid fa-check"></i> Xong';
                    showToast('Đã lấy dữ liệu!', 'success');
                } else throw new Error();
            } catch (e) {
                showToast('Lỗi lấy dữ liệu', 'error');
                btn.innerHTML = '<i class="fa-solid fa-rotate-right"></i> Thử lại';
            }
        }

        function fillForm(data) {
            document.getElementById('inp-raw-title').value = data.title;
            const parsed = parseTitle(data.title);
            document.getElementById('inp-name').value = parsed.name;
            document.getElementById('inp-author').value = parsed.author;
            document.getElementById('inp-count').value = data.count;
            if(data.img) {
                document.getElementById('inp-img').value = data.img;
                document.getElementById('img-preview').src = data.img;
                document.getElementById('img-preview-box').classList.add('has-img');
            }
            autoCategorize(data.title);
            document.getElementById('inp-status').value = 'Hoàn';
        }

        function parseTitle(rawTitle) {
            let clean = rawTitle.replace(/^\[.*?\]\s*/g, '').replace(/\[.*?\]/g, '').replace(/Full/gi, '').trim();
            let parts = clean.split(/[–|-]/).map(p => p.trim()).filter(p => p);
            return { name: parts[0] || clean, author: parts[1] && parts[1].length < 30 ? parts[1] : 'Đang cập nhật' };
        }

        function autoCategorize(t) {
            t = t.toLowerCase();
            const sel = document.getElementById('inp-cat');
            if(t.includes('chủ thụ')) sel.value = 'Chủ Thụ';
            else if(t.includes('chủ công')) sel.value = 'Chủ Công';
            else if(t.includes('hỗ công')) sel.value = 'Hỗ Công';
            else if(t.includes('hệ thống')) sel.value = 'Hệ Thống';
        }

        // === CRUD OPERATIONS ===
        async function addStory() {
            const btn = document.querySelector('.btn-primary');
            const oldHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ...';

            const payload = {
                name: document.getElementById('inp-name').value,
                author: document.getElementById('inp-author').value,
                count: document.getElementById('inp-count').value,
                status: document.getElementById('inp-status').value,
                playlist_id: document.getElementById('inp-pid').value,
                category: document.getElementById('inp-cat').value,
                image_url: document.getElementById('inp-img').value
            };

            if(!payload.name || !payload.playlist_id) { btn.innerHTML = oldHtml; return showToast('Thiếu thông tin!', 'error'); }

            const { error } = await db.from('playlists').insert([payload]);
            if(!error) {
                showToast('Thành công!', 'success');
                document.querySelectorAll('#view-add input').forEach(i => i.value = '');
                document.getElementById('img-preview-box').classList.remove('has-img');
            } else showToast(error.message, 'error');
            btn.innerHTML = oldHtml;
        }

        async function fetchData() {
            const { data } = await db.from('playlists').select('*').order('id', {ascending:false});
            allData = data || [];
            renderTable(allData);
        }

        function renderTable(list) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            list.forEach(item => {
                const img = item.image_url || `https://img.youtube.com/vi/${item.playlist_id}/mqdefault.jpg`;
                const stt = item.status === 'Hoàn' ? 'finished' : 'ongoing';
                tbody.innerHTML += `
                    <tr>
                        <td class="thumb-cell"><img src="${img}" loading="lazy"></td>
                        <td><div style="font-weight:700; color:#fff">${item.name}</div><div style="font-size:11px; color:#64748b">${item.category}</div></td>
                        <td style="color:#cbd5e1">${item.author}</td>
                        <td><span class="badge ${stt}">${item.status}</span></td>
                        <td style="font-weight:600; color:#94a3b8">${item.count}</td>
                        <td style="text-align:right">
                            <div class="btn-icon" onclick="openEdit(${item.id})"><i class="fa-solid fa-pen"></i></div>
                            <div class="btn-icon" onclick="del(${item.id})" style="color:#ef4444"><i class="fa-solid fa-trash"></i></div>
                        </td>
                    </tr>
                `;
            });
        }

        // --- EDIT LOGIC (New Feature) ---
        function openEdit(id) {
            const i = allData.find(x => x.id === id);
            document.getElementById('edit-id').value = i.id;
            document.getElementById('edit-name').value = i.name;
            document.getElementById('edit-author').value = i.author;
            document.getElementById('edit-count').value = i.count;
            document.getElementById('edit-status').value = i.status;
            document.getElementById('edit-cat').value = i.category;
            document.getElementById('edit-img').value = i.image_url || '';
            document.getElementById('edit-modal').classList.add('open');
        }

        function closeEdit() { document.getElementById('edit-modal').classList.remove('open'); }

        async function saveEdit() {
            const id = document.getElementById('edit-id').value;
            const updates = {
                name: document.getElementById('edit-name').value,
                author: document.getElementById('edit-author').value,
                count: document.getElementById('edit-count').value,
                status: document.getElementById('edit-status').value,
                category: document.getElementById('edit-cat').value,
                image_url: document.getElementById('edit-img').value
            };
            const { error } = await db.from('playlists').update(updates).eq('id', id);
            if(!error) { showToast('Đã cập nhật!', 'success'); closeEdit(); fetchData(); } 
            else showToast('Lỗi!', 'error');
        }

        async function del(id) {
            if(confirm('Xóa truyện này?')) {
                await db.from('playlists').delete().eq('id', id);
                showToast('Đã xóa!', 'success'); fetchData();
            }
        }

        function filterList() {
            const v = document.getElementById('search-list').value.toLowerCase();
            renderTable(allData.filter(i => i.name.toLowerCase().includes(v) || i.author.toLowerCase().includes(v)));
        }

        function showToast(msg, type) {
            const t = document.getElementById('toast');
            const icon = type === 'success' ? '<i class="fa-solid fa-circle-check" style="color:#10b981"></i>' : '<i class="fa-solid fa-circle-exclamation" style="color:#ef4444"></i>';
            t.innerHTML = `${icon} ${msg}`;
            t.style.border = type === 'success' ? '1px solid #10b981' : '1px solid #ef4444';
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
